<!DOCTYPE html>
<html>
<head>
    <title>Posts Manager</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #c0c0c0;
            color: #000000;
            margin: 0;
            padding: 5px;
        }
        h1 {
            text-align: center;
            color: #000080;
            font-size: 24px;
        }
        h2 {
            color: #000080;
            font-size: 18px;
            border-bottom: 2px solid #000000;
        }
        input, textarea {
            background-color: #ffffff;
            color: #000000;
            border: 2px outset #dfdfdf;
            padding: 3px;
            font-family: Arial;
            font-size: 11px;
            width: 100%;
            margin-bottom: 5px;
        }
        textarea {
            min-height: 60px;
        }
        button {
            background-color: #c0c0c0;
            color: #000000;
            border: 2px outset #dfdfdf;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            font-family: Arial;
            margin-bottom: 10px;
        }
        button:active {
            border-style: inset;
        }
        label {
            display: block;
            margin-bottom: 2px;
            font-size: 12px;
        }
        hr {
            border: 1px solid #808080;
            margin: 10px 0;
        }
        .post {
            background-color: #ffffcc;
            border: 1px solid #000000;
            padding: 5px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .post h3 {
            margin: 0 0 3px 0;
            color: #000080;
            font-size: 14px;
        }
        .post p {
            margin: 3px 0;
            color: #000000;
            font-size: 11px;
        }
        .meta {
            color: #666666;
            font-size: 10px;
            margin-bottom: 5px;
        }
        .status {
            background-color: #ffff00;
            border: 1px solid #000000;
            padding: 5px;
            margin-bottom: 10px;
            font-size: 11px;
        }
        #postsList {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<h1>POSTS MANAGER</h1>
<hr>

<h2>Create New Post</h2>

<div id="createStatus"></div>

<form id="postForm">
    <label>User ID (1-10):</label>
    <input type="number" id="userId" min="1" max="10" value="1" required>
    
    <label>Title:</label>
    <input type="text" id="title" required>
    
    <label>Content:</label>
    <textarea id="body" required></textarea>
    
    <button type="submit">CREATE POST</button>
</form>

<hr>

<h2>View Options</h2>

<button onclick="loadUsers()">VIEW USERS</button>
<button onclick="loadComments()">VIEW COMMENTS</button>
<button onclick="getStats()">VIEW STATS</button>

<hr>

<h2>All Posts</h2>

<button onclick="loadPosts()">REFRESH POSTS</button>

<div id="listStatus"></div>

<div id="postsList"></div>

<hr>

<p style="font-size: 10px; color: #666666; text-align: center;">
Posts Manager | Loaded from API<br>
Refresh your browser if needed
</p>

<script>
    const API_URL = 'http://localhost:5000/api';
    let allPosts = [];

    window.onload = () => {
        loadPosts();
    };

    async function loadPosts() {
        const statusDiv = document.getElementById('listStatus');
        statusDiv.innerHTML = '<div class="status">Loading posts...</div>';
        
        try {
            const response = await fetch(`${API_URL}/posts`);
            if (!response.ok) throw new Error('Failed');
            
            allPosts = await response.json();
            displayPosts(allPosts);
            statusDiv.innerHTML = `<div class="status">Loaded ${allPosts.length} posts</div>`;
        } catch (error) {
            statusDiv.innerHTML = `<div class="status">ERROR: ${error.message}</div>`;
        }
    }

    function displayPosts(posts) {
        const postsList = document.getElementById('postsList');
        
        if (posts.length === 0) {
            postsList.innerHTML = '<p>No posts</p>';
            return;
        }

        postsList.innerHTML = posts.map(post => `
            <div class="post">
                <h3>${post.title}</h3>
                <div class="meta">User ${post.userId} | ID: ${post.id}</div>
                <p>${post.body}</p>
                <button onclick="deletePost(${post.id})" style="width: 100%; background-color: #ff6666;">DELETE</button>
            </div>
        `).join('');
    }

    document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const statusDiv = document.getElementById('createStatus');
        const newPost = {
            userId: parseInt(document.getElementById('userId').value),
            title: document.getElementById('title').value,
            body: document.getElementById('body').value
        };

        statusDiv.innerHTML = '<div class="status">Creating...</div>';

        try {
            const response = await fetch(`${API_URL}/posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            });

            if (!response.ok) throw new Error('Failed');
            
            const createdPost = await response.json();
            allPosts.unshift(createdPost);
            displayPosts(allPosts);
            
            document.getElementById('postForm').reset();
            statusDiv.innerHTML = `<div class="status">Created! ID: ${createdPost.id}</div>`;
            
            setTimeout(() => statusDiv.innerHTML = '', 3000);
        } catch (error) {
            statusDiv.innerHTML = `<div class="status">ERROR: ${error.message}</div>`;
        }
    });

    async function deletePost(postId) {
        if (!confirm('Delete post ' + postId + '?')) return;

        const statusDiv = document.getElementById('listStatus');
        statusDiv.innerHTML = '<div class="status">Deleting...</div>';

        try {
            const response = await fetch(`${API_URL}/posts/${postId}`, {
                method: 'DELETE'
            });

            if (!response.ok) throw new Error('Failed');

            allPosts = allPosts.filter(p => p.id !== postId);
            displayPosts(allPosts);
            statusDiv.innerHTML = '<div class="status">Deleted!</div>';
            
            setTimeout(() => statusDiv.innerHTML = '', 2000);
        } catch (error) {
            statusDiv.innerHTML = `<div class="status">ERROR: ${error.message}</div>`;
        }
    }

    async function loadUsers() {
        try {
            const response = await fetch(`${API_URL}/users/names-only`);
            const users = await response.json();
            
            let list = users.map((u, i) => `${i+1}. ${u.name} - ${u.email}`).join('\n');
            alert(list);
        } catch (error) {
            alert('ERROR: ' + error.message);
        }
    }

    async function loadComments() {
        try {
            const response = await fetch(`${API_URL}/comments`);
            const comments = await response.json();
            
            let list = comments.slice(0, 5).map((c, i) => `${i+1}. ${c.name}\n${c.body.substring(0, 40)}...`).join('\n\n');
            alert(list);
        } catch (error) {
            alert('ERROR: ' + error.message);
        }
    }

    async function getStats() {
        try {
            const response = await fetch(`${API_URL}/stats`);
            const stats = await response.json();
            
            alert(
                'STATISTICS\n' +
                '\n' +
                'Users: ' + stats.totalUsers + '\n' +
                'Posts: ' + stats.totalPosts + '\n' +
                'Comments: ' + stats.totalComments + '\n' +
                'Avg per Post: ' + stats.avgCommentsPerPost
            );
        } catch (error) {
            alert('ERROR: ' + error.message);
        }
    }
</script>

</body>
</html>
